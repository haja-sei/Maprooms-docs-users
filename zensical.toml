extra_css = [
  "stylesheets/extra.css",
  "stylesheets/navigation-figures.css",
]

copyright = "© 2026 · Maprooms User Documentation"

[project.theme]
custom_dir = "overrides"
logo = "img/sei_logo.png"
font = false

features = [
  "toc.follow",
  "content.code.copy",
  "navigation.footer",
]

[project.extra]
generator = false

pdf_release = "User guide. Release 1.0.0"
pdf_publisher = "SEI · ENACTS"
pdf_date = "November 2026"


[project.plugins.mkdocs-video]
is_video = true
video_controls = true
video_autoplay = true
video_loop = false


[project.markdown_extensions]
tables = {}
toc.toc_depth = 4
pymdownx.highlight = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.tabbed.alternate_style = true

pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.plugins.glightbox]
enabled = true
auto = true
auto_caption = true

[project.theme.palette]
scheme = "default"
primary = "custom"
accent = "custom"

